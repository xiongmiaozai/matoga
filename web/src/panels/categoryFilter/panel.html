<div class="panel category-filter-panel" id="categoryFilterPanelWrap" data-panel="categoryFilter">
  <div class="panel-head">
    <div class="panel-title">
      <svg class="ico ico-sm"><use href="#i-filter" /></svg> <span data-i18n="categoryFilter.title">分类筛选</span>
    </div>
    <div class="panel-tools">
      <button class="panel-tool" data-panel-action="float" data-i18n-title="preview.float" title="浮动">
        <svg class="ico ico-sm"><use href="#i-external" /></svg>
      </button>
      <button class="panel-tool panel-close" data-panel-action="close" data-i18n-title="common.close" title="关闭">
        <svg class="ico ico-sm"><use href="#i-x" /></svg>
      </button>
    </div>
  </div>
  <div class="panel-body" style="padding: 0">
    <div class="cat-search-wrap">
      <svg class="ico ico-sm cat-search-ico"><use href="#i-search" /></svg>
      <input
        type="search"
        id="resultSearch"
        class="cat-search-input"
        autocomplete="off"
        data-i18n-placeholder="categoryFilter.searchPh"
        placeholder="搜索贴图 / 模型名称、拼音或中文…"
      />
      <button class="cat-search-clear" id="resultSearchClear" data-i18n-title="common.clear" title="清除">
        <svg class="ico ico-sm"><use href="#i-x" /></svg>
      </button>
    </div>
    <div id="categoryBar" class="category-bar"></div>
  </div>
</div>
