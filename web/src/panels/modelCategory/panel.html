<!-- 独立模型分类面板（工作区可拼装窗口） -->
<div class="panel model-category-panel" id="modelCategoryPanelWrap" data-panel="modelCategory">
  <div class="panel-head">
    <div class="panel-title"><svg class="ico ico-sm"><use href="#i-cube"/></svg> <span data-i18n="center.model">模型分类</span></div>
    <div class="panel-tools">
      <button class="panel-tool" data-panel-action="float" data-i18n-title="preview.float" title="浮动"><svg class="ico ico-sm"><use href="#i-external"/></svg></button>
      <button class="panel-tool panel-close" data-panel-action="close" data-i18n-title="common.close" title="关闭"><svg class="ico ico-sm"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="panel-body" style="padding:0">
    <div id="modelGridBody" class="model-grid-body"></div>
  </div>
</div>
