<div class="panel" id="nodeRelPanelWrap" data-panel="nodeRel" role="region" aria-label="节点关系">
  <div class="panel-head">
    <div class="panel-title"><svg class="ico ico-sm"><use href="#i-tree"/></svg> <span data-i18n="panel.nodeRel">节点关系</span></div>
    <div class="panel-tools">
      <button class="panel-tool" id="nrDirBtn" data-i18n-title="noderel.dirToggle" title="切换方向"><svg class="ico ico-sm"><use href="#i-swap"/></svg></button>
      <button class="panel-tool" id="nrExpandBtn" data-i18n-title="noderel.expandAll" title="全部展开"><svg class="ico ico-sm"><use href="#i-plus"/></svg></button>
      <button class="panel-tool" id="nrCollapseBtn" data-i18n-title="noderel.collapseAll" title="全部折叠"><svg class="ico ico-sm"><use href="#i-minus"/></svg></button>
      <button class="panel-tool" id="nrFitBtn" data-i18n-title="noderel.fit" title="自适应"><svg class="ico ico-sm"><use href="#i-maximize"/></svg></button>
      <button class="panel-tool panel-close" data-panel-action="close" title="关闭"><svg class="ico ico-sm"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="panel-body" style="padding:0">
    <div id="nodeRelView" class="nr-view"></div>
  </div>
</div>
