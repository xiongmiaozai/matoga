<div class="panel-card">
  <div class="panel-card-title"><svg class="ico ico-sm"><use href="#i-compare"/></svg><span data-i18n="sidebar.compareSettings">对比设置</span></div>
  <div class="opt-row">
    <label class="opt"><input type="radio" name="viewMode" value="all" checked /><span data-i18n="common.all">全部</span></label>
    <label class="opt"><input type="radio" name="viewMode" value="byFolder" /><span data-i18n="sidebar.byFolder">分类</span></label>
  </div>
  <div class="opt-row">
    <label class="opt"><input type="checkbox" id="recursiveChk" /><span data-i18n="sidebar.recursive">递归</span></label>
    <label class="opt"><input type="checkbox" id="onlyMissingChk" /><span data-i18n="sidebar.onlyMissing">仅不一致</span></label>
  </div>
  <div class="opt-row">
    <label class="opt"><input type="checkbox" id="ignoreChk" checked /><span data-i18n="sidebar.ignoreSys">忽略系统</span></label>
    <label class="opt"><input type="checkbox" id="hashChk" /><span data-i18n="sidebar.hashCheck">哈希校验</span></label>
  </div>
  <label class="opt-text"><span data-i18n="sidebar.customIgnore">自定义忽略</span><input type="text" id="ignoreInput" class="input-text" data-i18n-placeholder="sidebar.customIgnorePh" placeholder="*.tmp,*.bak" /></label>
</div>
