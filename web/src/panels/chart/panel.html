<!-- 独立可视化面板（工作区可拼装窗口） -->
<div class="panel chart-panel" id="chartPanelWrap" data-panel="chart">
  <div class="panel-head">
    <div class="panel-title"><svg class="ico ico-sm"><use href="#i-pie"/></svg> <span data-i18n="center.chart">可视化</span></div>
    <div class="panel-tools">
      <button class="panel-tool" data-panel-action="float" data-i18n-title="preview.float" title="浮动"><svg class="ico ico-sm"><use href="#i-external"/></svg></button>
      <button class="panel-tool panel-close" data-panel-action="close" data-i18n-title="common.close" title="关闭"><svg class="ico ico-sm"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="panel-body" style="padding:0;display:flex;flex-direction:column">
    <div id="chartContent" class="chart-content"></div>
  </div>
</div>
