<div class="folder-card" id="folderCard">
  <div class="folder-card-head">
    <div class="head-side head-side-left">
      <span class="tag tag-left" data-i18n="sidebar.leftTag">左侧 · 基准</span>
      <div class="side-actions">
        <button id="leftBtn" class="btn btn-primary btn-sm side-select-btn" data-i18n="common.select">选择</button>
        <button id="leftPackBtn" class="btn btn-ghost btn-sm pack-btn" data-i18n-title="sidebar.quickPick" title="快速选包（MC 资产包 / 官方包 / 制作包）"><svg class="ico ico-sm"><use href="#i-box"/></svg><svg class="ico ico-sm pack-caret"><use href="#i-chevron-down"/></svg></button>
      </div>
    </div>
    <div class="vs-divider" aria-hidden="true"><span class="vs-badge"><svg class="ico ico-xs"><use href="#i-compare"/></svg></span></div>
    <div class="head-side head-side-right">
      <span class="tag tag-right" data-i18n="sidebar.rightTag">右侧 · 对比</span>
      <div class="side-actions">
        <button id="rightBtn" class="btn btn-primary btn-sm side-select-btn" data-i18n="common.select">选择</button>
        <button id="rightPackBtn" class="btn btn-ghost btn-sm pack-btn" data-i18n-title="sidebar.quickPick" title="快速选包（MC 资产包 / 官方包 / 制作包）"><svg class="ico ico-sm"><use href="#i-box"/></svg><svg class="ico ico-sm pack-caret"><use href="#i-chevron-down"/></svg></button>
      </div>
    </div>
  </div>
  <div id="leftPath" class="path-box" data-i18n="common.empty">未选择</div>
  <div id="rightPath" class="path-box" data-i18n="common.empty">未选择</div>
</div>
