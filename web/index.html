  <title>matoga</title>

</head>
<body>

  <img src="assets/svg/corner-br.svg" alt="" class="mc-corner br" />
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

    <symbol id="i-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>

    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>

    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-pie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.21A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-depth" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20l6-8 4 5 3-4 7 7"/><path d="M2 20h20"/><circle cx="17" cy="6" r="2"/></symbol>
    <symbol id="i-opacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-metal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l3 18M15 3l-3 18"/></symbol>
    <symbol id="i-plastic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 8 6 11 6 14a6 6 0 0 0 12 0c0-3-2-6-6-12z"/></symbol>

    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  </svg>

  <header class="app-header">
    <div class="title">
      <img src="assets/matoga-logo-2x.png" alt="matoga" class="app-logo" />
      <span class="ver" data-i18n="app.version">v2.0</span>
    </div>
    <div class="header-search">
      <img src="assets/mc-icons/search.png" alt="" class="mc-ico" />
      <input type="search" id="searchInput" data-i18n-placeholder="header.search" placeholder="搜索…  ⌘K" />
    </div>
    <div class="header-actions">

      <button id="langBtn" class="icon-btn" data-i18n-title="header.language" title="语言"><img src="assets/mc-icons/globe.png" alt="" class="mc-ico" /></button>
      <button id="themeToggle" class="icon-btn" data-i18n-title="header.theme" title="切换深色/浅色模式"><svg class="ico"><use href="#i-moon"/></svg></button>
      <button id="settingsBtn" class="icon-btn" data-i18n-title="header.settings" title="设置"><svg class="ico"><use href="#i-settings"/></svg></button>
      <button id="pomDemoBtn" class="icon-btn" data-i18n-title="header.pomDemo" title="POM 演示"><svg class="ico"><use href="#i-depth"/></svg></button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar-left" id="sidebarLeft" data-region="left">

      <div class="sidebar-inner">
        <div class="folder-card" id="leftCard">
          <div class="folder-card-head">
            <span class="tag tag-left" data-i18n="sidebar.leftTag">左侧 · 基准</span>
            <button id="leftBtn" class="btn btn-primary btn-sm" data-i18n="common.select">选择</button>
          </div>
          <div id="leftPath" class="path-box" data-i18n="common.empty">未选择</div>
          <div id="leftStat" class="stat-box"></div>
          <div id="leftList" class="entry-list"></div>
        </div>

        <div class="folder-card" id="rightCard">
          <div class="folder-card-head">
            <span class="tag tag-right" data-i18n="sidebar.rightTag">右侧 · 对比</span>
            <button id="rightBtn" class="btn btn-primary btn-sm" data-i18n="common.select">选择</button>
          </div>
          <div id="rightPath" class="path-box" data-i18n="common.empty">未选择</div>
          <div id="rightStat" class="stat-box"></div>
          <div id="rightList" class="entry-list"></div>
        </div>

        <div class="panel-card">
          <div class="panel-card-title"><svg class="ico ico-sm"><use href="#i-compare"/></svg><span data-i18n="sidebar.compareSettings">对比设置</span></div>
          <div class="opt-row">
            <label class="opt"><input type="radio" name="viewMode" value="all" checked /><span data-i18n="common.all">全部</span></label>
            <label class="opt"><input type="radio" name="viewMode" value="byFolder" /><span data-i18n="sidebar.byFolder">分类</span></label>
          </div>
          <div class="opt-row">
            <label class="opt"><input type="checkbox" id="recursiveChk" /><span data-i18n="sidebar.recursive">递归</span></label>
            <label class="opt"><input type="checkbox" id="onlyMissingChk" /><span data-i18n="sidebar.onlyMissing">仅不一致</span></label>
          </div>
          <div class="opt-row">
            <label class="opt"><input type="checkbox" id="ignoreChk" checked /><span data-i18n="sidebar.ignoreSys">忽略系统</span></label>
            <label class="opt"><input type="checkbox" id="hashChk" /><span data-i18n="sidebar.hashCheck">哈希校验</span></label>
          </div>
          <label class="opt-text"><span data-i18n="sidebar.customIgnore">自定义忽略</span><input type="text" id="ignoreInput" class="input-text" data-i18n-placeholder="sidebar.customIgnorePh" placeholder="*.tmp,*.bak" /></label>
        </div>


        <div class="panel-card">
          <div class="panel-card-title"><svg class="ico ico-sm"><use href="#i-swap"/></svg><span data-i18n="sidebar.actions">操作</span></div>
          <button id="compareBtn2" class="btn btn-accent" disabled data-i18n="sidebar.startCompare">开始对比</button>
          <div class="action-row">
            <button id="undoBtn" class="btn btn-ghost btn-sm" disabled><svg class="ico ico-sm"><use href="#i-undo"/></svg> <span data-i18n="sidebar.undo">撤回</span></button>
            <button id="swapBtn2" class="btn btn-ghost btn-sm"><svg class="ico ico-sm"><use href="#i-swap"/></svg> <span data-i18n="sidebar.swap">交换</span></button>
          </div>
          <div class="action-row">
            <button id="batchRightBtn" class="btn btn-sm" disabled data-i18n="sidebar.batchRight">批量→右</button>
            <button id="batchLeftBtn" class="btn btn-sm" disabled data-i18n="sidebar.batchLeft">批量→左</button>
          </div>
          <div class="action-row">
            <button id="exportBtn" class="btn btn-ghost btn-sm" disabled><svg class="ico ico-sm"><use href="#i-download"/></svg> <span>TXT</span></button>
            <button id="exportHtmlBtn" class="btn btn-ghost btn-sm" disabled><svg class="ico ico-sm"><use href="#i-download"/></svg> <span>HTML</span></button>
            <button id="clearMemBtn" class="btn btn-ghost btn-sm" disabled><svg class="ico ico-sm"><use href="#i-trash"/></svg></button>
          </div>
        </div>
      </div>
    </aside>


    <div class="resizer" data-resize="left" data-i18n-title="sidebar.resizeLeft" title="拖拽调整左栏宽度"></div>

    <main class="center" data-region="center">
      <div class="center-head">
        <div class="center-title-bar">
          <span class="center-title"><svg class="ico ico-sm"><use href="#i-compare"/></svg> <span data-i18n="center.compareResult">对比结果</span></span>
          <div class="view-tabs">
            <button class="view-tab active" data-view="table" data-i18n-title="center.tableView" title="表格视图 (Ctrl+1)"><svg class="ico ico-sm"><use href="#i-layers"/></svg> <span data-i18n="center.table">表格</span></button>
            <button class="view-tab" data-view="chart" data-i18n-title="center.chartView" title="可视化视图 (Ctrl+2)"><svg class="ico ico-sm"><use href="#i-pie"/></svg> <span data-i18n="center.chart">可视化</span></button>
          </div>
        </div>
        <div id="statsDashboard" class="stats-dashboard"></div>
        <div id="tableToolbar" class="table-toolbar">
          <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" data-i18n="center.filterAll">全部</button>
            <button class="filter-btn" data-filter="missing" data-i18n="center.filterMissing">缺失</button>
            <button class="filter-btn" data-filter="diff" data-i18n="center.filterDiff">不同</button>
            <button class="filter-btn" data-filter="extra" data-i18n="center.filterExtra">多余</button>
          </div>
          <div id="summary" class="summary"></div>
        </div>
      </div>
      <div id="tableView" class="view-pane active">
        <div class="result-table-wrap">
          <table id="resultTable" class="result-table">
            <thead>
              <tr>
                <th class="col-status" data-key="status" data-i18n="common.status">状态</th>
                <th class="col-preview" data-i18n="center.colPreview">预览</th>
                <th class="col-name" data-key="name" data-i18n="common.name">名称</th>
                <th class="col-type" data-key="type" data-i18n="common.type">类型</th>
                <th class="col-size" data-key="size" data-i18n="common.size">大小</th>
                <th class="col-mtime" data-key="mtime" data-i18n="center.colMtime">修改时间</th>
                <th class="col-left" data-key="left" data-i18n="center.colLeft">左</th>
                <th class="col-right" data-key="right" data-i18n="center.colRight">右</th>
              </tr>
            </thead>
            <tbody id="resultBody">
              <tr class="empty-row"><td colspan="8"><svg class="ico ico-empty"><use href="#i-folder"/></svg><br><span data-i18n="center.emptyHint">拖拽文件夹到左侧卡片开始对比</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="chartView" class="view-pane">
        <div id="chartContent" class="chart-content"></div>
      </div>
    </main>

    <div class="resizer" data-resize="right" data-i18n-title="sidebar.resizeRight" title="拖拽调整右栏宽度"></div>

    <aside class="sidebar-right" id="sidebarRight" data-region="right">
      <div class="panel" id="previewPanelWrap" data-panel="preview">
        <div class="panel-head">
          <div class="pv-tabs">
            <button class="active" data-pv-tab="2d"><svg class="ico ico-sm"><use href="#i-image"/></svg> <span data-i18n="preview.2d">2D</span></button>
            <button data-pv-tab="3d"><svg class="ico ico-sm"><use href="#i-cube"/></svg> <span data-i18n="preview.3d">3D</span></button>
          </div>
          <div class="panel-tools">
            <button class="panel-tool" data-panel-action="float" data-i18n-title="preview.float" title="浮动"><svg class="ico ico-sm"><use href="#i-external"/></svg></button>

                    <div class="m3d-ctrl-group">
                      <label class="m3d-slider"><span data-i18n="m3d.anisoLevel">各向异性</span><input type="range" id="m3dAniso" min="1" max="16" step="1" value="4" /><span class="m3d-val" id="m3dAnisoVal">4</span></label>
                      <label class="m3d-checkbox"><input type="checkbox" id="m3dMipmaps" checked /> Mipmap</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="m3d-resizer" id="m3dResizer" data-i18n-title="m3d.resizer" title="上下拖拽调整大小 · 双击重置"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" id="detailPanelWrap" data-panel="detail">
        <div class="panel-head">
          <span class="panel-title"><svg class="ico ico-sm"><use href="#i-clipboard"/></svg> <span data-i18n="detail.title">详情</span></span>
          <div class="panel-tools">
            <button class="panel-tool" data-panel-action="collapse" data-i18n-title="preview.collapse" title="折叠"><svg class="ico ico-sm"><use href="#i-chevron-down"/></svg></button>
          </div>
        </div>
        <div class="panel-body">
          <div class="detail-panel" id="detailPanel">
            <div class="detail-hint" data-i18n="preview.notSelected">未选中</div>
          </div>

          <div class="action-panel" id="actionPanel"></div>
        </div>
      </div>
    </aside>
  </div>

  <div id="settingsDrawer" class="settings-drawer">
    <div class="settings-head">
      <span class="settings-title" data-i18n="settings.title">设置</span>
      <button id="settingsClose" class="icon-btn" data-i18n-title="common.close" title="关闭"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.appearance">外观</div>
        <label class="opt"><input type="checkbox" id="settingThemeChk" /><span data-i18n="settings.darkMode">深色模式</span></label>
      </div>
      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.language">语言</div>
        <div class="m3d-segment" id="langSeg">
          <button class="active" data-lang="zh" data-i18n="lang.zh">中文</button>
          <button data-lang="en" data-i18n="lang.en">English</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.paths">路径</div>
        <div class="path-setting">
          <span class="path-setting-label" data-i18n="settings.hdriPreset">HDRI 预设</span>
          <div class="path-setting-row">
            <input type="text" id="hdriPresetPathInput" class="input-text" data-i18n-placeholder="common.path" placeholder="路径" />
            <button id="hdriPresetPickBtn" class="btn btn-ghost btn-sm" data-i18n="settings.pick">选</button>
            <button id="hdriPresetCreateBtn" class="btn btn-ghost btn-sm" data-i18n="settings.create">建</button>
            <button id="hdriPresetOpenBtn" class="btn btn-ghost btn-sm" data-i18n="settings.open">开</button>
          </div>
        </div>
        <div class="path-setting">
          <span class="path-setting-label" data-i18n="settings.mcPacks">MC 材质包</span>
          <div class="path-setting-row">
            <input type="text" id="mcPacksPathInput" class="input-text" data-i18n-placeholder="common.path" placeholder="路径" />
            <button id="mcPacksPickBtn" class="btn btn-ghost btn-sm" data-i18n="settings.pick">选</button>
            <button id="mcPacksCreateBtn" class="btn btn-ghost btn-sm" data-i18n="settings.create">建</button>
            <button id="mcPacksOpenBtn" class="btn btn-ghost btn-sm" data-i18n="settings.open">开</button>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.about">关于</div>
        <div class="detail-row"><span class="detail-label" data-i18n="settings.version">版本</span><span data-i18n="app.version">v2.0</span></div>
        <div class="detail-row"><span class="detail-label" data-i18n="app.title">matoga</span></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="ctxMenu" class="ctx-menu" style="display:none">
    <button class="ctx-item" data-act="open-left"><svg class="ico ico-sm"><use href="#i-folder"/></svg> <span data-i18n="ctx.openLeft">打开左侧</span></button>
    <button class="ctx-item" data-act="loc-left"><svg class="ico ico-sm"><use href="#i-folder"/></svg> <span data-i18n="ctx.locLeft">定位左侧</span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" data-act="open-right"><svg class="ico ico-sm"><use href="#i-folder"/></svg> <span data-i18n="ctx.openRight">打开右侧</span></button>
    <button class="ctx-item" data-act="loc-right"><svg class="ico ico-sm"><use href="#i-folder"/></svg> <span data-i18n="ctx.locRight">定位右侧</span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" data-act="copy-to-right"><svg class="ico ico-sm"><use href="#i-compare"/></svg> <span data-i18n="ctx.copyRight">复制到右侧</span></button>
    <button class="ctx-item" data-act="copy-to-left"><svg class="ico ico-sm"><use href="#i-compare"/></svg> <span data-i18n="ctx.copyLeft">复制到左侧</span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" data-act="copy"><svg class="ico ico-sm"><use href="#i-clipboard"/></svg> <span data-i18n="ctx.copyName">复制名称</span></button>
  </div>

  <div id="previewModal" class="preview-modal">
    <div class="preview-modal-inner">
      <button id="previewClose" class="preview-close" data-i18n-title="common.close" title="关闭"><svg class="ico"><use href="#i-x"/></svg></button>
      <img id="previewImg" class="preview-img" alt="" />
      <div id="previewCaption" class="preview-caption"></div>
    </div>
  </div>

  <div id="syncModal" class="sync-modal" style="display:none">
    <div class="sync-modal-inner">
      <div class="sync-title" id="syncTitle">批量复制</div>
      <div class="sync-bar-wrap"><div class="sync-bar" id="syncBar" style="width:0%"></div></div>
      <div class="sync-info">
        <span id="syncCount">0/0</span>
        <span id="syncOkFail" style="opacity:.7"></span>
      </div>
      <div class="sync-name" id="syncName"></div>
      <button class="btn btn-ghost" id="syncCancel">取消</button>
    </div>
  </div>

  <script src="/api/api-client.js"></script>
  <script src="/api/folder-tree.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
