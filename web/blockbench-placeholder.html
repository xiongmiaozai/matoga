<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'" />
  <title>Blockbench 模型开发</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #1e1e1e; color: #e6e6e6; }
    .card { max-width: 480px; padding: 40px; text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; opacity: .9; }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 600; }
    p { color: #9a9a9a; line-height: 1.6; margin: 0 0 24px; font-size: 14px; }
    button { background: #3a7bd5; color: #fff; border: 0; padding: 11px 26px; border-radius: 6px;
      font-size: 14px; cursor: pointer; transition: background .15s; }
    button:hover { background: #2f6cc0; }
    button:disabled { background: #444; cursor: wait; }
    .log { margin-top: 18px; text-align: left; background: #161616; border: 1px solid #2a2a2a;
      border-radius: 6px; padding: 12px; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
      color: #8a8a8a; max-height: 180px; overflow: auto; white-space: pre-wrap; display: none; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#3a7bd5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>
    </svg>
    <h1>Blockbench 模型开发板块</h1>
    <p>尚未拉取 Blockbench Web 产物。点击下方按钮从官方仓库（gh-pages 分支）拉取最新版本，拉取后即可离线使用，并自动加载 matoga 桥接插件实现双向联动。</p>
    <button id="fetchBtn">拉取 Blockbench</button>
    <div class="log" id="log"></div>
  </div>
  <script>
    const btn = document.getElementById('fetchBtn')
    const log = document.getElementById('log')
    function getToken() { try { return new URLSearchParams(location.search).get('matoga-token') || '' } catch { return '' } }
    async function fetchBB() {
      btn.disabled = true; btn.textContent = '拉取中…（可能需要 1-2 分钟）'; log.style.display = 'block'; log.textContent = '正在克隆 gh-pages 分支…'
      try {
        const headers = { 'Content-Type': 'application/json' }
        const t = getToken(); if (t) headers['x-matoga-token'] = t
        const res = await fetch('/api/blockbench/fetch', { method: 'POST', headers })
        const r = await res.json()
        if (r && r.ok && r.data && r.data.installed) {
          log.innerHTML = '<span class="ok">✓ 拉取成功，版本 ' + ((r.data.version && r.data.version.version) || '未知') + '</span>\n即将刷新…'
          setTimeout(() => location.reload(), 800)
        } else {
          log.textContent = '失败: ' + (r && r.msg || '未知错误')
          btn.disabled = false; btn.textContent = '重试'
        }
      } catch (e) { log.textContent = '失败: ' + e.message; btn.disabled = false; btn.textContent = '重试' }
    }
    btn.addEventListener('click', fetchBB)
  </script>
</body>
</html>
