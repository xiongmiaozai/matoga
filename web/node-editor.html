<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>matoga · 节点画布</title>
<script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js" } }
</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mc-theme.css">
<link rel="stylesheet" href="node-canvas.css">
<style>
/* ════════════════════════════════════════════════════════════
   matoga Node Canvas — 无限画布节点编辑器
   主题：Minecraft 像素风 × Linear 精致深色
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#1a1a1e; --bg-2:#141418;
  --panel:#2a2a2e; --panel-2:#333338; --panel-3:#3a3a40;
  --border:#4a4a52; --border-soft:#3a3a40;
  --text:#e8e8e8; --text-muted:#9a9a9a; --text-dim:#6a6a6a;
  --primary:#7cbd56; --primary-hover:#8fd468; --primary-soft:#2a3a22;
  --accent:#5bcefa; --accent-soft:#1a2a3a;
  --danger:#c63a3a; --warn:#f5a623; --extra:#c084fc;
  --type-number:#7cbd56; --type-color:#c084fc; --type-texture:#f5a623;
  --type-material:#5bcefa; --type-env:#f5a623; --type-any:#9a9a9a;
  --type-vector:#e8e8e8;
  --grid:#262629; --grid-2:#1e1e22;
  --shadow:0 4px 0 0 rgba(0,0,0,.5), 0 0 0 1px var(--border);
  --ease:cubic-bezier(.2,.7,.2,1);
  --lib-w:208px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:13px;
  -webkit-font-smoothing:antialiased; user-select:none}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer}
input{font-family:inherit}

/* ── 顶栏 ───────────────────────────────────── */
.topbar{position:fixed; top:0; left:0; right:0; height:44px; z-index:100;
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border); backdrop-filter:blur(8px)}
.topbar .logo{display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.5px}
.topbar .logo .dot{width:10px; height:10px; background:var(--primary);
  box-shadow:0 0 8px var(--primary); image-rendering:pixelated}
.topbar .logo .sub{color:var(--text-muted); font-weight:400; font-size:11px; margin-left:4px}
.topbar .spacer{flex:1}
.tbtn{height:28px; padding:0 12px; display:inline-flex; align-items:center; gap:6px;
  background:var(--panel-2); border:1px solid var(--border-soft); color:var(--text);
  transition:all .12s var(--ease)}
.tbtn:hover{background:var(--panel-3); border-color:var(--primary); color:var(--primary-hover)}
.tbtn:active{transform:translateY(1px)}
.tbtn.danger:hover{border-color:var(--danger); color:var(--danger)}
.tbtn .k{color:var(--text-dim); font-size:10px; margin-left:4px;
  padding:1px 4px; background:var(--bg); border:1px solid var(--border-soft)}
.zoom-pill{height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:8px;
  background:var(--bg-2); border:1px solid var(--border-soft); color:var(--text-muted);
  font-variant-numeric:tabular-nums; min-width:90px; justify-content:center}
.zoom-pill button{width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--text-muted); font-size:14px}
.zoom-pill button:hover{color:var(--primary)}

/* ── 左侧节点库（精致图标 / 可折叠分组 / 拖拽创建）── */
.library{position:fixed; top:44px; left:0; bottom:0; width:var(--lib-w); z-index:90;
  background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden; transition:transform .2s var(--ease)}
.library.collapsed{transform:translateX(calc(-1 * var(--lib-w)))}
.library-head{height:28px; flex:none; display:flex; align-items:center; gap:6px;
  padding:0 8px; border-bottom:1px solid var(--border); background:var(--panel-2)}
.library-title{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--text);
  text-transform:uppercase; flex:1}
.library-close{width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  background:none; border:none; color:var(--text-muted); font-size:14px; cursor:pointer;
  border-radius:4px; transition:all .12s var(--ease)}
.library-close:hover{color:var(--danger); background:var(--panel-3)}
.library-body{flex:1; overflow-y:auto; padding:6px 0 10px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent}
.library-body::-webkit-scrollbar{width:8px}
.library-body::-webkit-scrollbar-track{background:transparent}
.library-body::-webkit-scrollbar-thumb{background:var(--border-soft); border-radius:4px;
  border:2px solid transparent; background-clip:padding-box}
.library-body::-webkit-scrollbar-thumb:hover{background:var(--border); background-clip:padding-box}
.lib-resize{position:absolute; right:-3px; top:0; bottom:0; width:6px; cursor:ew-resize; z-index:91;
  background:transparent; transition:background .12s var(--ease)}
.lib-resize:hover{background:var(--primary)}
/* 搜索框 */
.lib-search{position:relative; display:flex; align-items:center; margin:0 8px 8px}
.lib-search-ico{position:absolute; left:8px; color:var(--text-dim); font-size:13px; pointer-events:none; line-height:1}
.lib-search input{width:100%; box-sizing:border-box; padding:5px 24px 5px 26px;
  border:1px solid var(--border-soft); border-radius:6px; background:var(--bg);
  color:var(--text); font-size:11px; transition:border-color .12s var(--ease), background .12s var(--ease)}
.lib-search input:focus{outline:none; border-color:var(--primary); background:var(--bg-2)}
.lib-search input::placeholder{color:var(--text-dim)}
.lib-search-clear{position:absolute; right:5px; width:16px; height:16px; display:inline-flex;
  align-items:center; justify-content:center; background:none; border:none; color:var(--text-dim);
  font-size:11px; cursor:pointer; border-radius:3px; line-height:1}
.lib-search-clear:hover{color:var(--text); background:var(--panel-3)}
.lib-search-clear[hidden]{display:none}
/* 分组头（可折叠） */
.lib-group-head{display:flex; align-items:center; gap:6px; padding:8px 10px 5px;
  cursor:pointer; user-select:none; border-radius:4px; margin:0 4px; transition:background .1s var(--ease)}
.lib-group-head:hover{background:var(--panel-2)}
.lib-arrow{width:10px; flex:none; color:var(--text-dim); font-size:10px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; transition:transform .15s var(--ease)}
.lib-group-head.collapsed .lib-arrow{transform:rotate(-90deg)}
.lib-gname{flex:1; font-size:10px; font-weight:600; letter-spacing:1.2px;
  color:var(--text-dim); text-transform:uppercase}
.lib-count{font-size:9px; padding:1px 6px; border-radius:8px;
  background:var(--bg); color:var(--text-dim); font-variant-numeric:tabular-nums;
  border:1px solid var(--border-soft); line-height:1.4}
.lib-group-items{padding:0 0 4px}
.lib-sub-head{display:flex; align-items:center; gap:5px; padding:4px 10px 3px 18px;
  cursor:pointer; user-select:none; border-radius:4px; margin:0 4px;
  transition:background .1s var(--ease)}
.lib-sub-head:hover{background:var(--panel-2)}
.lib-sub-arrow{width:9px; flex:none; color:var(--text-dim); font-size:9px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition:transform .15s var(--ease)}
.lib-sub-head.collapsed .lib-sub-arrow{transform:rotate(-90deg)}
.lib-sub-name{flex:1; font-size:10px; font-weight:500; color:var(--text-muted)}
.lib-sub-count{font-size:8px; padding:1px 5px; border-radius:8px;
  background:var(--bg); color:var(--text-dim); font-variant-numeric:tabular-nums;
  border:1px solid var(--border-soft); line-height:1.4}
.lib-sub-items{padding:0 0 2px}
.library h3{display:none}
/* 节点条目 */
.lib-item{display:flex; align-items:center; gap:8px; padding:5px 10px; margin:0 4px;
  cursor:grab; border-radius:6px; border:1px solid transparent;
  transition:background .1s var(--ease), border-color .1s var(--ease), transform .08s var(--ease)}
.lib-item:hover{background:var(--panel-2); border-color:var(--border-soft); transform:translateX(1px)}
.lib-item:active{cursor:grabbing; transform:translateX(1px) scale(.99)}
.lib-item .ic{width:16px; height:16px; flex:none; display:inline-flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; line-height:1; color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.5); border:1px solid rgba(0,0,0,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.lib-item .ic-circle{border-radius:50%}
.lib-item .ic-square{border-radius:3px}
.lib-item .ic-rounded{border-radius:5px}
.lib-item .ic-diamond{border:none; border-radius:2px; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.lib-item .ic-hex{border:none; border-radius:0; clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.lib-item .nm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; color:var(--text)}
.lib-item .ports{flex:none; font-size:9px; color:var(--text-dim); font-variant-numeric:tabular-nums;
  opacity:.65; letter-spacing:.3px}
.lib-item:hover .ports{opacity:1; color:var(--text-muted)}
.lib-sep{display:none}
/* 空状态 */
.lib-empty{display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:28px 12px; color:var(--text-dim); font-size:11px; text-align:center}
.lib-empty-ico{font-size:22px; opacity:.5}
/* 拖拽落点提示 */
.canvas-wrap.lib-drop-target{cursor:copy}
.canvas-wrap.lib-drop-target::after{content:''; position:absolute; inset:0; z-index:6;
  pointer-events:none; border:2px dashed var(--primary); border-radius:2px;
  background:rgba(124,189,86,.05); animation:lib-drop-pulse 1s ease-in-out infinite}
@keyframes lib-drop-pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ── 画布 ───────────────────────────────────── */
.canvas-wrap{position:fixed; top:44px; left:var(--lib-w); right:0; bottom:28px;
  background:var(--bg-2); overflow:hidden; cursor:grab}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.connecting{cursor:crosshair}
.canvas-wrap.library-collapsed{left:0}
.canvas-wrap.minimized{height:28px; bottom:auto}
.canvas-head{position:absolute; top:0; left:0; right:0; height:28px; z-index:5;
  display:flex; align-items:center; gap:6px; padding:0 8px; pointer-events:none;
  background:linear-gradient(180deg,var(--panel) 0%,rgba(42,42,46,.55) 100%);
  border-bottom:1px solid var(--border)}
.canvas-title{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--text);
  text-transform:uppercase; flex:1; pointer-events:none}
.canvas-close{width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  background:none; border:none; color:var(--text-muted); font-size:14px; cursor:pointer;
  border-radius:4px; transition:all .12s var(--ease); pointer-events:auto}
.canvas-close:hover{color:var(--danger); background:var(--panel-3)}
.world{position:absolute; top:0; left:0; width:0; height:0; transform-origin:0 0;
  will-change:transform}
.grid-bg{position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-2) 1px, transparent 1px);
  background-size:24px 24px, 24px 24px, 120px 120px, 120px 120px;
  opacity:.7}
.edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;
  width:1px; height:1px}
.edges .edge{fill:none; stroke-width:2.5; pointer-events:stroke; cursor:pointer;
  transition:stroke-width .1s}
.edges .edge-hit{fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer}
.edges .edge.selected{stroke-width:3.5}
.edge-temp{fill:none; stroke:var(--primary); stroke-width:2.5; stroke-dasharray:4 3;
  pointer-events:none}

/* ── 节点 ───────────────────────────────────── */
.node{position:absolute; width:200px; background:var(--panel);
  border:1px solid var(--border); box-shadow:var(--shadow);
  pointer-events:auto; transition:border-color .1s, box-shadow .1s}
.node.selected{border-color:var(--primary); box-shadow:0 4px 0 0 rgba(0,0,0,.5), 0 0 0 1px var(--primary), 0 0 16px rgba(124,189,86,.25)}
.node.dragging{opacity:.92}
.node-head{display:flex; align-items:center; gap:6px; height:28px; padding:0 8px;
  background:var(--panel-2); border-bottom:1px solid var(--border-soft);
  cursor:grab; position:relative}
.node-head::before{content:''; position:absolute; top:0; left:0; bottom:0; width:3px;
  background:var(--node-color, var(--text-dim))}
.node-head .title{flex:1; font-weight:600; font-size:12px; padding-left:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.node-head .badge{width:8px; height:8px; background:var(--node-color, var(--text-dim));
  image-rendering:pixelated}
.node-head .x{width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--text-dim); opacity:0; transition:opacity .1s}
.node:hover .node-head .x{opacity:1}
.node-head .x:hover{color:var(--danger); background:var(--panel-3)}
.node-body{padding:6px 0}
.port-row{display:flex; align-items:center; height:22px; padding:0 8px; position:relative}
.port-row.in{justify-content:flex-start}
.port-row.out{justify-content:flex-end}
.port{width:11px; height:11px; background:var(--panel); border:2px solid var(--port-color, var(--text-dim));
  position:absolute; top:50%; transform:translateY(-50%); cursor:crosshair;
  transition:background .1s, transform .1s; z-index:2}
.port.in{left:-6px}
.port.out{right:-6px}
.port:hover, .port.active{background:var(--port-color); transform:translateY(-50%) scale(1.25)}
.port.linked{background:var(--port-color)}
.port-label{font-size:11px; color:var(--text-muted); padding:0 6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px}
.port-row.in .port-label{padding-left:10px}
.port-row.out .port-label{padding-right:10px; text-align:right}

/* widget 区 */
.widget{padding:6px 10px; border-top:1px solid var(--border-soft)}
.widget:first-child{border-top:none}
.w-label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;
  margin-bottom:4px}
.w-num{display:flex; align-items:center; gap:8px}
.w-num input[type=range]{flex:1; height:4px; -webkit-appearance:none; appearance:none;
  background:var(--bg); border:1px solid var(--border-soft); outline:none}
.w-num input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
  width:10px; height:14px; background:var(--primary); cursor:pointer; border:none}
.w-num input[type=range]::-moz-range-thumb{width:10px; height:14px; background:var(--primary);
  cursor:pointer; border:none}
.w-num .val{font-variant-numeric:tabular-nums; font-size:11px; color:var(--primary);
  min-width:42px; text-align:right}
.w-color{display:flex; align-items:center; gap:8px}
.w-color input[type=color]{width:28px; height:22px; border:1px solid var(--border-soft);
  background:none; cursor:pointer; padding:0}
.w-color input[type=color]::-webkit-color-swatch{border:none}
.w-color input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.w-color .hex{font-variant-numeric:tabular-nums; font-size:11px; color:var(--text-muted);
  font-family:'JetBrains Mono',ui-monospace,monospace}
.w-text{width:100%; height:22px; padding:0 6px; background:var(--bg);
  border:1px solid var(--border-soft); color:var(--text); font-size:11px; outline:none}
.w-text:focus{border-color:var(--primary)}
.w-select{width:100%; height:22px; padding:0 6px; background:var(--bg);
  border:1px solid var(--border-soft); color:var(--text); font-size:11px; outline:none;
  cursor:pointer}
.w-select:focus{border-color:var(--primary)}
.w-preview{width:100%; aspect-ratio:1/1; background:var(--bg); border:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  image-rendering:pixelated}
.w-preview .pv-text{font-size:10px; color:var(--text-muted); font-family:ui-monospace,monospace;
  text-align:center; padding:4px; word-break:break-all; line-height:1.4}
.w-preview .pv-swatch{position:absolute; inset:0}
.w-preview .pv-empty{color:var(--text-dim); font-size:10px}
.pv-imgbox{position:relative; height:100%; aspect-ratio:1/1; margin:0 auto;
  overflow:hidden; display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--border-soft); border-radius:4px; flex:none}
.pv-imgbox img{max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated}
.pv-imgbox .pv-dim{position:absolute; right:2px; bottom:2px; z-index:2;
  font-size:9px; font-family:ui-monospace,monospace; color:#fff;
  background:rgba(0,0,0,.65); padding:1px 4px; border-radius:3px; pointer-events:none}
.w-tex{display:flex; align-items:center; gap:6px}
.w-tex .thumb{width:32px; height:32px; background:var(--bg); border:1px solid var(--border-soft);
  image-rendering:pixelated; flex:none; overflow:hidden}
.w-tex .thumb img{width:100%; height:100%; object-fit:cover; display:block}
.w-tex .info{flex:1; min-width:0}
.w-tex .info .fn{font-size:10px; color:var(--text-muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.w-tex .info .btn{font-size:10px; color:var(--accent); padding:2px 0; cursor:pointer}
.w-tex .info .btn:hover{color:var(--primary)}

/* ── 右键菜单 ───────────────────────────────── */
.ctx-menu{position:fixed; z-index:200; min-width:180px; background:var(--panel);
  border:1px solid var(--border); box-shadow:0 8px 0 0 rgba(0,0,0,.5), 0 0 0 1px var(--border);
  padding:4px 0; max-height:60vh; overflow-y:auto}
.ctx-menu .grp{font-size:9px; text-transform:uppercase; letter-spacing:1.5px;
  color:var(--text-dim); padding:8px 10px 4px; font-weight:600}
.ctx-menu .item{display:flex; align-items:center; gap:8px; padding:5px 10px; cursor:pointer;
  border-left:2px solid transparent}
.ctx-menu .item:hover{background:var(--panel-2); border-left-color:var(--primary)}
.ctx-menu .item .ic{width:10px; height:10px; flex:none}
.ctx-menu .item .nm{flex:1}
.ctx-menu .item .sc{font-size:10px; color:var(--text-dim)}
.ctx-menu .sep{height:1px; background:var(--border-soft); margin:4px 0}
.ctx-menu .item.danger:hover{border-left-color:var(--danger); color:var(--danger)}
.ctx-menu .subgrp{font-size:9px; color:var(--text-muted); padding:3px 10px 2px 16px;
  letter-spacing:.5px; border-left:2px solid transparent}

/* ── 底栏 ───────────────────────────────────── */
.statusbar{position:fixed; bottom:0; left:var(--lib-w); right:0; height:28px; z-index:90;
  display:flex; align-items:center; gap:16px; padding:0 12px;
  background:var(--panel); border-top:1px solid var(--border);
  font-size:11px; color:var(--text-muted); transition:left .2s var(--ease)}
.statusbar.library-collapsed{left:0}
.statusbar .seg{display:inline-flex; align-items:center; gap:6px}
.statusbar .seg b{color:var(--text); font-variant-numeric:tabular-nums}
.statusbar .seg .dot{width:6px; height:6px; background:var(--primary)}
.statusbar .spacer{flex:1}
.statusbar .hint{color:var(--text-dim); font-size:10px}
.statusbar .hint .k{padding:1px 4px; background:var(--bg); border:1px solid var(--border-soft);
  color:var(--text-muted); margin:0 1px}

/* ── toast ─────────────────────────────────── */
.toast{position:fixed; bottom:48px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:300; background:var(--panel-2); border:1px solid var(--primary); color:var(--text);
  padding:8px 16px; font-size:12px; opacity:0; pointer-events:none;
  transition:all .25s var(--ease); box-shadow:0 4px 0 0 rgba(0,0,0,.5)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* 滚动条 */
::-webkit-scrollbar{width:8px; height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-soft); border:1px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border)}

/* 像素角标 */
.pixel{image-rendering:pixelated; -ms-interpolation-mode:nearest-neighbor}

/* ── 右侧预览面板（3D/2D 联动）────────────── */
.preview-pane{position:fixed; top:44px; right:0; bottom:28px; width:680px; z-index:80;
  background:var(--panel); border-left:1px solid var(--border);
  display:flex; flex-direction:column; transition:transform .2s var(--ease)}
.preview-pane.hidden{transform:translateX(680px)}
/* node-editor 不支持面板浮动：强制覆盖 styles.css 的 .panel.floating，
   即使残留 .floating class 也不会脱离 .preview-pane 变成独立悬浮窗 */
#previewPanelWrap.floating{
  position:static !important; z-index:auto !important;
  width:auto !important; height:auto !important;
  resize:none !important; box-shadow:none !important;
  border:0 !important; border-radius:0 !important;
}
/* 覆盖外链 styles.css 的 .panel 双重边框/阴影（.preview-pane 已有边框） */
#previewPanelWrap{
  border:none !important; box-shadow:none !important; border-radius:0 !important;
  background:transparent !important;
}
.preview-pane .pp-head{height:32px; display:flex; align-items:center; gap:6px; padding:0 10px;
  background:var(--panel-2); border-bottom:1px solid var(--border-soft)}
.preview-pane .pp-tabs{display:flex; gap:2px}
.preview-pane .pp-tab{height:22px; padding:0 10px; display:inline-flex; align-items:center;
  background:var(--bg); border:1px solid var(--border-soft); color:var(--text-muted);
  font-size:11px; transition:all .1s}
.preview-pane .pp-tab.active{color:var(--primary); background:var(--primary-soft); border-color:var(--primary)}
.preview-pane .pp-spacer{flex:1}
.preview-pane .pp-icbtn{width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--border-soft); color:var(--text-muted); font-size:12px}
.preview-pane .pp-icbtn:hover{color:var(--primary); border-color:var(--primary)}
.preview-pane .pp-icbtn.active{color:var(--primary); border-color:var(--primary)}
.pp-body{flex:1; position:relative; overflow:hidden; background:#1a1a2e}
.pp-body .pp-content{position:absolute; inset:0; display:none}
.pp-body .pp-content.active{display:block}
#material3dContainer{width:100%; height:100%; position:relative; overflow:hidden}
#material3dContainer canvas{width:100%!important; height:100%!important; display:block}
#preview2dContainer{width:100%; height:100%; overflow:auto; padding:10px;
  display:flex; flex-direction:column; gap:8px; background:var(--panel-2)}
.pv2-card{background:var(--panel); border:1px solid var(--border-soft); padding:6px}
.pv2-card .lbl{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px}
.pv2-card .imgwrap{width:100%; min-height:80px; background:var(--bg); display:flex; align-items:center; justify-content:center; image-rendering:pixelated}
.pv2-card .imgwrap img{max-width:100%; max-height:220px; display:block}
.pv2-card .empty{color:var(--text-dim); font-size:11px; padding:20px 0}
.pv2-color-card{display:flex; align-items:center; gap:8px}
.pv2-color-card .sw{width:40px; height:40px; border:1px solid var(--border-soft); image-rendering:pixelated}
.pv2-color-card .hx{font-family:ui-monospace,monospace; font-size:11px; color:var(--text-muted)}
.pp-foot{height:26px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:var(--panel-2); border-top:1px solid var(--border-soft); font-size:10px; color:var(--text-dim)}
.pp-foot .seg{display:inline-flex; align-items:center; gap:4px}
.pp-foot .seg b{color:var(--text); font-variant-numeric:tabular-nums}
.m3d-ctrl{position:absolute; top:8px; right:8px; z-index:5; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:180px}
.m3d-ctrl select, .m3d-ctrl button{height:22px; background:rgba(20,20,30,.85); border:1px solid var(--border);
  color:var(--text); font-size:10px; padding:0 6px; backdrop-filter:blur(4px)}
.m3d-ctrl select:hover, .m3d-ctrl button:hover{border-color:var(--primary); color:var(--primary)}
.m3d-ctrl button.active{color:var(--primary); border-color:var(--primary)}
.m3d-badge{position:absolute; top:8px; left:8px; z-index:5; padding:3px 8px;
  background:rgba(20,20,30,.85); border:1px solid var(--border-soft); color:var(--text-dim);
  font-size:10px; backdrop-filter:blur(4px)}
.m3d-badge.ok{color:var(--primary); border-color:var(--primary)}
.m3d-badge.err{color:var(--danger); border-color:var(--danger)}
/* 画布缩窄给预览腾位 */
  .canvas-wrap.has-preview{right:680px}
  .statusbar.has-preview{right:680px}
}
/* 导入对话框（带遮罩模态框） */
.import-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.import-overlay.open{display:flex}
.import-dlg{width:760px;max-width:92vw;max-height:82vh;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6)}
.import-dlg-head{height:42px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft);font-weight:700;font-size:13px;user-select:none}
.import-dlg-head .x{cursor:pointer;color:var(--text-muted);font-size:16px}
.import-dlg-head .x:hover{color:var(--danger)}
.import-dlg-body{flex:1;overflow:auto;padding:12px 16px}
.import-side{margin-bottom:18px}
.import-side h4{font-size:12px;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.import-side h4 .tag{font-size:10px;padding:1px 6px;background:var(--bg);border:1px solid var(--border-soft);border-radius:3px;color:var(--text-dim);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.import-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.import-card{background:var(--bg);border:1px solid var(--border-soft);border-radius:4px;padding:6px;cursor:pointer;transition:all .15s}
.import-card:hover{border-color:var(--primary)}
.import-card.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary)}
.import-card .thumb{width:100%;height:80px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px;image-rendering:pixelated;border-radius:3px}
.import-card .thumb img{width:100%;height:100%;object-fit:cover}
.import-card .nm{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.import-card .roles{font-size:9px;color:var(--text-dim);margin-top:3px;display:flex;gap:3px}
.import-card .roles .r{padding:1px 4px;border-radius:2px;font-weight:600}
.import-card .roles .r.main{background:var(--primary-soft);color:var(--primary)}
.import-card .roles .r.normal{background:var(--accent-soft);color:var(--accent)}
.import-card .roles .r.specular{background:#3a2a1a;color:var(--warn)}
.import-dlg-foot{height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-soft);gap:12px}
.import-dlg-foot .info{font-size:11px;color:var(--text-muted);flex:1}
.import-dlg-foot .btns{display:flex;gap:8px}
.import-dlg-foot button{height:28px;padding:0 14px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:4px;cursor:pointer;font-size:12px}
.import-dlg-foot button:hover{border-color:var(--primary);color:var(--primary)}
.import-dlg-foot button.primary{background:var(--primary);border-color:var(--primary);color:#1a1a1e;font-weight:600}
.import-dlg-foot button.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.import-dlg-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border-soft);background:var(--panel-2);flex-wrap:wrap}
.import-search{flex:1;min-width:180px;height:28px;padding:0 10px;background:var(--bg);border:1px solid var(--border-soft);border-radius:4px;color:var(--text);font-size:12px}
.import-search:focus{outline:none;border-color:var(--primary)}
.import-seg{display:inline-flex;gap:2px}
.import-seg button{height:24px;padding:0 8px;background:var(--bg);border:1px solid var(--border-soft);color:var(--text-muted);font-size:11px;cursor:pointer;border-radius:3px}
.import-seg button:hover{color:var(--text);border-color:var(--border)}
.import-seg button.active{color:var(--primary);background:var(--primary-soft);border-color:var(--primary)}
.import-mini-btn{height:24px;padding:0 8px;background:var(--bg);border:1px solid var(--border-soft);color:var(--text-muted);font-size:11px;cursor:pointer;border-radius:3px}
.import-mini-btn:hover{color:var(--primary);border-color:var(--primary)}
.import-count{font-size:11px;color:var(--text-dim);margin-left:auto;white-space:nowrap}
.import-side.collapsed .import-grid{display:none}
.import-side h4{cursor:pointer;user-select:none}
.import-side h4 .caret{display:inline-block;width:10px;color:var(--text-dim);transition:transform .15s}
.import-side.collapsed h4 .caret{transform:rotate(-90deg)}
.import-empty{padding:32px;text-align:center;color:var(--text-dim);font-size:12px}
.import-loading{padding:32px;text-align:center;color:var(--text-muted);font-size:12px}

/* ── embed 模式：被主页 iframe 嵌入时隐藏顶栏、左侧节点库、右侧预览 ── */
body.embed .topbar{display:none}
body.embed .library{display:none}
body.embed .preview-pane{display:none}
body.embed .canvas-wrap{top:0; left:0}
body.embed .canvas-wrap.library-collapsed{left:0}
body.embed .canvas-wrap.has-preview{right:0}
body.embed .statusbar{left:0}
body.embed .statusbar.library-collapsed{left:0}
body.embed .statusbar.has-preview{right:0}
</style>

                        <button id="m3dHdrBtn" class="btn btn-ghost btn-sm"><svg class="ico ico-sm"><use href="#i-globe"/></svg> <span data-i18n="m3d.loadHdr">加载HDR</span></button>
                        <button id="m3dHdrClearBtn" class="btn btn-ghost btn-sm" data-i18n="m3d.clearHdr">清除HDR</button>
                        <button id="m3dHdrRefreshBtn" class="btn btn-ghost btn-sm"><svg class="ico ico-sm"><use href="#i-refresh"/></svg> <span data-i18n="m3d.refresh">刷新</span></button>
                      </div>
                      <div class="m3d-ctrl-group">
                        <div class="m3d-segment" id="m3dHdrUsageSeg">
                          <button class="active" data-hdruage="both" data-i18n="m3d.hdrUsageBoth">环境+背景</button>
                          <button data-hdruage="env" data-i18n="m3d.hdrUsageEnv">仅环境</button>
                          <button data-hdruage="bg" data-i18n="m3d.hdrUsageBg">仅背景</button>
                        </div>
                      </div>
                      <div class="m3d-ctrl-group">
                        <label class="m3d-slider"><span data-i18n="m3d.hdrRotation">旋转</span><input type="range" id="m3dHdrRotation" min="0" max="360" step="1" value="0" /><span class="m3d-val" id="m3dHdrRotationVal">0°</span></label>

                      </div>
                      <div class="m3d-hdr-info" id="m3dHdrInfo"></div>
                      <div class="m3d-ctrl-group">
                        <input type="text" id="m3dHdrSearch" class="m3d-hdr-search" data-i18n-placeholder="m3d.hdrSearchPh" placeholder="搜索预设..." />
                      </div>
                      <div class="hdri-thumb-progress" id="m3dHdrThumbProgress"><div class="hdri-thumb-progress-bar"></div><span class="hdri-thumb-progress-text"></span></div>
                      <div class="hdri-preset-grid" id="m3dHdrPresetGrid"></div>
                    </div>
                    <div class="m3d-ctrl-group">
                      <label class="m3d-slider"><span data-i18n="m3d.envIntensity">环境</span><input type="range" id="m3dEnvIntensity" min="0" max="3" step="0.01" value="0.5" /><span class="m3d-val" id="m3dEnvIntensityVal">0.50</span></label>
                      <label class="m3d-slider"><span data-i18n="m3d.exposure">曝光</span><input type="range" id="m3dExposure" min="0" max="3" step="0.01" value="2.2" /><span class="m3d-val" id="m3dExposureVal">2.20</span></label>
                      <label class="m3d-checkbox"><input type="checkbox" id="m3dGround" /> <span data-i18n="m3d.ground">地面</span></label>
                      <label class="m3d-checkbox"><input type="checkbox" id="m3dAutoRotate" checked /> <span data-i18n="m3d.autoRotate">自转</span></label>
                      <label class="m3d-checkbox"><input type="checkbox" id="m3dWireframe" /><span data-i18n="m3d.wireframe">线框</span></label>
                    </div>
                  </div>
                  <div class="m3d-tab-pane" data-pane="advanced">
                    <div class="m3d-ctrl-group m3d-advanced-row">
                      <span class="m3d-light-label" data-i18n="m3d.format">材质格式</span>
                      <select id="m3dFormat" class="input-select input-select-sm">
                        <option value="auto" data-i18n="m3d.formatAuto">自动检测</option>
                        <option value="labpbr">labPBR</option>
                        <option value="old" data-i18n="m3d.formatOld">旧版 PBR</option>
                      </select>
                      <span class="m3d-format-detected" id="m3dFormatDetected"></span>
                    </div>
                    <div class="m3d-ctrl-group">

                      <span class="m3d-light-label" data-i18n="m3d.texFilter">纹理过滤</span>
                      <div class="m3d-segment" id="m3dFilterSeg">
                        <button class="active" data-filter="nearest" data-i18n="preview.filterNearest">邻近</button>
                        <button data-filter="bilinear" data-i18n="preview.filterBilinear">双线性</button>
                        <button data-filter="trilinear" data-i18n="preview.filterTrilinear">三线性</button>
                        <button data-filter="anisotropic" data-i18n="preview.filterAniso">各向异性</button>
                      </div>
                    </div>
                    <div class="m3d-ctrl-group">
                      <label class="m3d-slider"><span data-i18n="m3d.anisoLevel">各向异性</span><input type="range" id="m3dAniso" min="1" max="16" step="1" value="4" /><span class="m3d-val" id="m3dAnisoVal">4</span></label>
                      <label class="m3d-checkbox"><input type="checkbox" id="m3dMipmaps" checked /> Mipmap</label>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>


<!-- 底栏 -->
<div class="statusbar has-preview" id="statusbar">
  <span class="seg"><span class="dot pixel"></span>就绪</span>
  <span class="seg">节点 <b id="stat-nodes">0</b></span>
  <span class="seg">连线 <b id="stat-edges">0</b></span>
  <span class="seg">缩放 <b id="stat-zoom">100%</b></span>
  <span class="spacer"></span>
  <span class="hint">
    <span class="k">右键</span>添加 ·
    <span class="k">拖拽空白</span>平移 ·
    <span class="k">滚轮</span>缩放 ·
    <span class="k">Del</span>删除 ·
    <span class="k">F</span>适应
  </span>
</div>

<div class="toast" id="toast"></div>

<script src="/api/api-client.js"></script>
<script type="module" src="/src/node-editor-main.js"></script>

<!-- HDR 预览模态框（preview-panel.js 需要） -->
<div id="hdrPreviewModal" class="hdr-preview-modal">
  <div class="hdr-preview-inner">
    <button id="hdrPreviewClose" class="preview-close" data-i18n-title="common.close" title="关闭"><svg class="ico"><use href="#i-x"/></svg></button>
    <canvas id="hdrPreviewCanvas" class="hdr-preview-canvas"></canvas>
    <div class="hdr-preview-controls">
      <label class="m3d-slider"><span data-i18n="m3d.hdrPreviewExposure">预览曝光</span><input type="range" id="hdrPreviewExposure" min="-3" max="3" step="0.1" value="0" /><span class="m3d-val" id="hdrPreviewExposureVal">0.0</span></label>
      <div class="hdr-preview-info" id="hdrPreviewInfo"></div>
    </div>
  </div>
</div>

<!-- 导入贴图对话框 -->
<div class="import-overlay" id="importOverlay">
  <div class="import-dlg">
    <div class="import-dlg-head">
      <span>导入贴图为节点</span>
      <span class="x" id="importClose">✕</span>
    </div>
    <div class="import-dlg-toolbar">
      <input type="text" id="importSearch" class="import-search" placeholder="搜索贴图名称…">
      <div class="import-seg" id="importRoleSeg">
        <button class="active" data-role="all">全部</button>
        <button data-role="main">仅主</button>
        <button data-role="normal">含法线</button>
        <button data-role="specular">含高光</button>
      </div>
      <div class="import-seg" id="importSortSeg">
        <button class="active" data-sort="name-asc">名↑</button>
        <button data-sort="name-desc">名↓</button>
      </div>
      <button id="importSelectAll" class="import-mini-btn">全选</button>
      <button id="importClearAll" class="import-mini-btn">清空</button>
      <span class="import-count" id="importCount"></span>
    </div>
    <div class="import-dlg-body" id="importBody"></div>
    <div class="import-dlg-foot">
      <span class="info" id="importInfo">点击贴图组卡片选择，再次点击取消。选中后点"导入"创建纹理节点。</span>
      <div class="btns">
        <button id="importCancel">取消</button>
        <button class="primary" id="importOk">导入所选</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
