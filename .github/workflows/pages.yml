name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 暂存 main 分支待部署文件
          mkdir -p /tmp/deploy
          cp website/landing.html /tmp/deploy/index.html
          cp website/matoga-logo-2x.png /tmp/deploy/
          cp website/app-screenshot.png /tmp/deploy/

          # 切换到 gh-pages 分支（远端已存在）
          git checkout gh-pages

          # 清理旧 assets 目录（新版 landing 页不再引用 assets 资源）
          rm -rf assets

          # 覆盖更新 landing 页与图片资源
          cp /tmp/deploy/index.html .
          cp /tmp/deploy/matoga-logo-2x.png .
          cp /tmp/deploy/app-screenshot.png .

          git add -A assets
          git add index.html matoga-logo-2x.png app-screenshot.png
          if git diff --cached --quiet; then
            echo "::notice::没有变更，跳过部署"
          else
            git commit -m "chore(pages): 同步 main 分支 landing.html & 图片资源"
            git push origin gh-pages
            echo "::notice::已部署到 gh-pages 分支"
          fi