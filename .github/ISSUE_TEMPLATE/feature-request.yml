name: 功能建议 / Feature Request
description: 提出新功能或改进建议
labels: ['enhancement', 'needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前使用中遇到什么不便？描述场景而非方案。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 matoga 怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式？为什么没选？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 文件夹对比
        - 2D 差异预览
        - 3D 材质预览
        - 节点材质编辑器
        - Blockbench 集成
        - MC 模型预览
        - 资产库
        - 面板 / 工作区
        - 文件操作 / 同步
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考资料、草图、类似工具的实现等
